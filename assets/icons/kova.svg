<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2536"/>
      <stop offset="55%" stop-color="#131722"/>
      <stop offset="100%" stop-color="#0B0E15"/>
    </linearGradient>
    <radialGradient id="glow1" cx="72%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#4C9AFF" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#7C5CFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B0E15" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CB7FF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#3B4760" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="stem1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5FF"/>
      <stop offset="100%" stop-color="#A8B8D8"/>
    </linearGradient>
    <linearGradient id="upperArm1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="lowerArm1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#04070D" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="64" y="64" width="896" height="896" rx="206" fill="url(#bg1)"/>
  <rect x="64" y="64" width="896" height="896" rx="206" fill="url(#glow1)"/>
  <rect x="70" y="70" width="884" height="884" rx="200" fill="none" stroke="url(#rim1)" stroke-width="6"/>

  <!-- Subtle architectural grid lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2">
    <line x1="256" y1="120" x2="256" y2="904"/>
    <line x1="512" y1="120" x2="512" y2="904"/>
    <line x1="768" y1="120" x2="768" y2="904"/>
    <line x1="120" y1="512" x2="904" y2="512"/>
  </g>

  <!-- Sculpted "K" Monogram -->
  <g filter="url(#shadow1)">
    <!-- Forged Titanium Vertical Stem -->
    <path d="M276 254 C276 240 287 228 302 228 L398 228 C412 228 424 240 424 254 L424 770 C424 784 412 796 398 796 L302 796 C287 796 276 784 276 770 Z" fill="url(#stem1)"/>
    <!-- Lower Cobalt-Violet Arm -->
    <path d="M446 534 L554 446 L760 762 C770 778 759 796 740 796 L622 796 C610 796 599 790 592 780 Z" fill="url(#lowerArm1)"/>
    <!-- Upper Electric-Cyan Velocity Arm -->
    <path d="M446 490 L612 240 C619 232 629 228 640 228 L754 228 C773 228 784 249 772 265 L560 538 C545 557 518 560 499 546 Z" fill="url(#upperArm1)"/>
    <!-- Forged Spark Node at Junction -->
    <polygon points="452,512 512,462 558,512 512,562" fill="#E0F2FE" fill-opacity="0.92"/>
  </g>
</svg>
