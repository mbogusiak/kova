[metadata]
id = "kova-light"
name = "Kova Light"
author = "Kova Contributors"
polarity = "light"
schema_version = 1

[surfaces]
canvas = "#EAEFF5"
island = "#F5F7FA"
editor = "#FFFFFF"
elevated = "#FFFFFF"
overlay = "#0F172A59"
hover = "#E8EEF5"
active = "#DCE7F7"
tab_inactive = "#EEF2F7"
