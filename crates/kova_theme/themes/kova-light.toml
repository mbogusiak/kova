statusbar = "#E4EAF2"
input = "#FFFFFF"
scrollbar_thumb = "#94A3B880"
scrollbar_thumb_hover = "#64748BB3"

[text]
primary = "#161D29"
secondary = "#475569"
muted = "#5B687C"
inverse = "#FFFFFF"

[borders]
island = "#D5DEE9"
subtle = "#E2E8F0"
strong = "#8A98AC"
focus = "#2563EB"
tab_indicator = "#2563EB"
input = "#8493A7"

[editor]
