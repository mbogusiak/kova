run_icon = "#15803D"
debug_icon = "#B45309"
breakpoint = "#DC2626"
git_added = "#16A34A"
git_modified = "#2563EB"
git_deleted = "#DC2626"

[syntax]
keyword = "#7C3AED"
keyword_control = "#6D28D9"
type = "#0369A1"
type_builtin = "#1D4ED8"
annotation = "#9A4D00"
function = "#1E40AF"
variable = "#161D29"
parameter = "#9A3412"
property = "#0E7490"
constant = "#B45309"
string = "#15803D"
string_escape = "#0F766E"
