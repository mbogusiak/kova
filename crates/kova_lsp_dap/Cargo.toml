[package]
name                   = "kova_lsp_dap"
description            = "Asynchronous LSP, BSP and DAP bridge with RAM limits and JVM auto-hibernation (headless)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
publish.workspace      = true

[dependencies]
kova_buffer    = { workspace = true }
kova_config    = { workspace = true }
kova_core      = { workspace = true }
kova_toolchain = { workspace = true }
lsp-types      = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
url            = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
