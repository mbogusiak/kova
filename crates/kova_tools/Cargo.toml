[package]
name                   = "kova_tools"
description            = "JVM developer tools: Git, .http request runner, JUnit results model and PTY terminal (headless)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
publish.workspace      = true

[dependencies]
alacritty_terminal = { workspace = true }
kova_config        = { workspace = true }
kova_theme         = { workspace = true }
kova_toolchain     = { workspace = true }
portable-pty       = { workspace = true }
reqwest            = { workspace = true }
roxmltree          = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
kova_buffer = { workspace = true }
kova_syntax = { workspace = true }
tempfile    = { workspace = true }

[lints]
workspace = true
