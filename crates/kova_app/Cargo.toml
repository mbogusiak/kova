[package]
name                   = "kova_app"
description            = "Startup binary, GPUI initialization and event loop for Kova IDE."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
publish.workspace      = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kova"
path = "src/main.rs"
doc  = false

[dependencies]
gpui.workspace       = true
kova_core.workspace  = true
kova_theme.workspace = true
kova_ui.workspace    = true

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }

[lints]
workspace = true
