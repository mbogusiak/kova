[package]
name                   = "kova_app"
description            = "Startup binary, GPUI initialization and event loop for Kova IDE."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
publish.workspace      = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kova"
path = "src/main.rs"
doc  = false

[dependencies]
gpui.workspace        = true
kova_buffer.workspace = true
kova_config.workspace = true
kova_core.workspace   = true
kova_jvm_index.workspace = true
kova_lsp_dap.workspace = true
kova_theme.workspace  = true
kova_toolchain.workspace = true
kova_tools.workspace  = true
kova_ui.workspace     = true
lsp-types.workspace   = true
thiserror.workspace   = true
tokio = { workspace = true, features = ["io-util", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
zip.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }

[lints]
workspace = true
