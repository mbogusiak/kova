# Built-in JetBrains Keymap preset for macOS (IntelliJ macOS / macOS System Shortcuts).
# Schema compatible with ~/.config/kova/keymap.toml (KOVA-017 / KOVA-018).
schema_version = 1
preset = "jetbrains"

# ==============================================================================
# Navigation & Search
# ==============================================================================

[[bindings]]
context = "Global"
key = "shift shift"
action = "navigation.search_everywhere"

[[bindings]]
context = "Global"
key = "cmd+shift+a"
action = "navigation.find_action"

[[bindings]]
context = "Workspace"
key = "cmd+o"
action = "navigation.go_to_class"

[[bindings]]
context = "Workspace"
key = "cmd+shift+o"
action = "navigation.go_to_file"

[[bindings]]
context = "Workspace"
key = "cmd+alt+o"
action = "navigation.go_to_symbol"

[[bindings]]
context = "Editor"
key = "cmd+l"
action = "navigation.go_to_line"

[[bindings]]
context = "EditorText"
key = "cmd+b"
action = "navigation.go_to_declaration"

[[bindings]]
context = "EditorText"
key = "cmd+alt+b"
action = "navigation.go_to_implementation"

[[bindings]]
context = "EditorText"
key = "cmd+u"
action = "navigation.go_to_super"

[[bindings]]
context = "Workspace"
key = "alt+f7"
action = "navigation.find_usages"

[[bindings]]
context = "Workspace"
key = "cmd+["
action = "navigation.back"

[[bindings]]
context = "Workspace"
key = "cmd+]"
action = "navigation.forward"

[[bindings]]
context = "Workspace"
key = "cmd+e"
action = "navigation.recent_files"

[[bindings]]
context = "Editor"
key = "cmd+f12"
action = "navigation.file_structure"

[[bindings]]
context = "Workspace"
key = "f2"
action = "navigation.next_error"

[[bindings]]
context = "Workspace"
key = "shift+f2"
action = "navigation.prev_error"

[[bindings]]
context = "Workspace"
key = "cmd+shift+]"
action = "navigation.next_tab"

[[bindings]]
context = "Workspace"
key = "cmd+shift+["
action = "navigation.prev_tab"

# ==============================================================================
# Editor, Search & Multi-Cursor
# ==============================================================================

[[bindings]]
context = "Workspace"
key = "cmd+s"
action = "editor.save"

[[bindings]]
context = "EditorText"
key = "cmd+z"
action = "editor.undo"

[[bindings]]
context = "EditorText"
key = "cmd+shift+z"
action = "editor.redo"

[[bindings]]
context = "EditorText"
key = "cmd+x"
action = "editor.cut"

[[bindings]]
context = "EditorText"
key = "cmd+c"
action = "editor.copy"

[[bindings]]
context = "EditorText"
key = "cmd+v"
action = "editor.paste"

[[bindings]]
context = "EditorText"
key = "cmd+a"
action = "editor.select_all"

[[bindings]]
context = "Editor"
when = "!vim_enabled"
key = "escape"
action = "editor.escape"

[[bindings]]
context = "EditorText"
key = "cmd+d"
action = "editor.duplicate_line"

[[bindings]]
context = "EditorText"
key = "cmd+backspace"
action = "editor.delete_line"

[[bindings]]
context = "EditorText"
key = "cmd+/"
action = "editor.toggle_line_comment"

[[bindings]]
context = "EditorText"
key = "cmd+alt+/"
action = "editor.toggle_block_comment"

[[bindings]]
context = "EditorText"
key = "alt+up"
action = "editor.extend_selection"

[[bindings]]
context = "EditorText"
key = "alt+down"
action = "editor.shrink_selection"

[[bindings]]
context = "EditorText"
key = "alt+shift+up"
action = "editor.move_line_up"

[[bindings]]
context = "EditorText"
key = "alt+shift+down"
action = "editor.move_line_down"

[[bindings]]
context = "EditorText"
key = "cmd+shift+up"
action = "editor.move_statement_up"

[[bindings]]
context = "EditorText"
key = "cmd+shift+down"
action = "editor.move_statement_down"

[[bindings]]
context = "EditorText"
key = "cmd+alt+l"
action = "editor.reformat_code"

[[bindings]]
context = "EditorText"
key = "ctrl+alt+o"
action = "editor.optimize_imports"

[[bindings]]
context = "EditorText"
key = "alt+enter"
action = "editor.show_intentions"

[[bindings]]
context = "EditorText"
key = "ctrl+space"
action = "editor.complete_basic"

[[bindings]]
context = "EditorText"
key = "ctrl+shift+space"
action = "editor.complete_smart"

[[bindings]]
context = "EditorText"
key = "cmd+p"
action = "editor.parameter_info"

[[bindings]]
context = "EditorText"
key = "f1"
action = "editor.quick_doc"

[[bindings]]
context = "EditorText"
key = "ctrl+g"
action = "editor.add_next_occurrence"

[[bindings]]
context = "EditorText"
key = "ctrl+shift+g"
action = "editor.unselect_occurrence"

[[bindings]]
context = "EditorText"
key = "ctrl+cmd+g"
action = "editor.select_all_occurrences"

[[bindings]]
context = "Editor"
key = "cmd+f"
action = "editor.find"

[[bindings]]
context = "Editor"
key = "cmd+r"
action = "editor.replace"

[[bindings]]
context = "Workspace"
key = "cmd+shift+f"
action = "editor.find_in_files"

[[bindings]]
context = "Workspace"
key = "cmd+shift+r"
action = "editor.replace_in_files"

[[bindings]]
context = "Editor"
key = "cmd+g"
action = "editor.find_next"

[[bindings]]
context = "Editor"
key = "cmd+shift+g"
action = "editor.find_prev"

[[bindings]]
context = "EditorText"
key = "cmd+-"
action = "editor.fold_region"

[[bindings]]
context = "EditorText"
key = ["cmd+plus", "cmd+="]
action = "editor.unfold_region"

[[bindings]]
context = "EditorText"
key = "cmd+shift+-"
action = "editor.fold_all"

[[bindings]]
context = "EditorText"
key = ["cmd+shift+plus", "cmd+shift+="]
action = "editor.unfold_all"

# ==============================================================================
# Refactoring
# ==============================================================================

[[bindings]]
context = "Workspace"
key = "shift+f6"
action = "refactor.rename"

[[bindings]]
context = "EditorText"
key = "cmd+alt+v"
action = "refactor.extract_variable"

[[bindings]]
context = "EditorText"
key = "cmd+alt+m"
action = "refactor.extract_method"

[[bindings]]
context = "EditorText"
key = "cmd+alt+c"
action = "refactor.extract_constant"

[[bindings]]
context = "EditorText"
key = "cmd+alt+f"
action = "refactor.extract_field"

[[bindings]]
context = "EditorText"
key = "cmd+alt+n"
action = "refactor.inline"

[[bindings]]
context = "EditorText"
key = "cmd+f6"
action = "refactor.change_signature"

# ==============================================================================
# Run & Debug
# ==============================================================================

[[bindings]]
context = "Workspace"
key = "ctrl+shift+r"
action = "run.run_context"

[[bindings]]
context = "Workspace"
key = "ctrl+r"
action = "run.run_last"

[[bindings]]
context = "Workspace"
key = "ctrl+shift+d"
action = "run.debug_context"

[[bindings]]
context = "Workspace"
key = "ctrl+d"
action = "run.debug_last"

[[bindings]]
context = "Workspace"
key = "cmd+f2"
action = "run.stop"

[[bindings]]
context = "Editor"
key = "cmd+f8"
action = "debug.toggle_line_breakpoint"

[[bindings]]
context = "Workspace"
key = "f8"
action = "debug.step_over"

[[bindings]]
context = "Workspace"
key = "f7"
action = "debug.step_into"

[[bindings]]
context = "Workspace"
key = "shift+f8"
action = "debug.step_out"

[[bindings]]
context = "Workspace"
key = "cmd+alt+r"
action = "debug.resume"

[[bindings]]
context = "Workspace"
key = "alt+f8"
action = "debug.evaluate_expression"

# ==============================================================================
# Tool Windows, View (Omarchy Focus/Tiling), Git & Vim
# ==============================================================================

[[bindings]]
context = "Workspace"
key = "cmd+1"
action = "tool_window.project"

[[bindings]]
context = "Workspace"
key = "cmd+4"
action = "tool_window.run"

[[bindings]]
context = "Workspace"
key = "cmd+5"
action = "tool_window.debug"

[[bindings]]
context = "Workspace"
key = "cmd+6"
action = "tool_window.problems"

[[bindings]]
context = "Workspace"
key = "cmd+7"
action = "tool_window.structure"

[[bindings]]
context = "Workspace"
key = "cmd+9"
action = "tool_window.git"

[[bindings]]
context = "Workspace"
key = "alt+f12"
action = "tool_window.terminal"

[[bindings]]
context = "Workspace"
key = "cmd+shift+f12"
action = "tool_window.hide_all"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+z"
action = "view.toggle_focus_mode"

[[bindings]]
context = "Global"
key = "cmd+,"
action = "view.open_settings"

[[bindings]]
context = "Workspace"
key = "cmd+w"
action = "view.close_tab"

[[bindings]]
context = "Workspace"
key = "cmd+k"
action = "git.commit"

[[bindings]]
context = "Workspace"
key = "cmd+shift+k"
action = "git.push"

[[bindings]]
context = "Workspace"
key = "cmd+t"
action = "git.update_project"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+shift+v"
action = "vim.toggle"

# ==============================================================================
# Focus / Tiling window management (KOVA-026, Omarchy keyboard-first). Tiling
# modifier on macOS: `ctrl+alt`. Vim users also get `Ctrl+W h/j/k/l/s/v`.
# ==============================================================================

[[bindings]]
context = "Workspace"
key = "ctrl+alt+t"
action = "view.toggle_tiling_mode"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+left"
action = "window.focus_left"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+right"
action = "window.focus_right"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+up"
action = "window.focus_up"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+down"
action = "window.focus_down"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+shift+left"
action = "window.move_tab_left"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+shift+right"
action = "window.move_tab_right"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+shift+up"
action = "window.move_tab_up"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+shift+down"
action = "window.move_tab_down"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+cmd+left"
action = "window.resize_left"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+cmd+right"
action = "window.resize_right"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+cmd+up"
action = "window.resize_up"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+cmd+down"
action = "window.resize_down"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+backslash"
action = "window.split_right"

[[bindings]]
context = "Workspace"
key = "ctrl+alt+minus"
action = "window.split_down"

[[bindings]]
context = "EditorVimNormal"
key = "ctrl+w h"
action = "window.focus_left"

[[bindings]]
context = "EditorVimNormal"
key = "ctrl+w l"
action = "window.focus_right"

[[bindings]]
context = "EditorVimNormal"
key = "ctrl+w k"
action = "window.focus_up"

[[bindings]]
context = "EditorVimNormal"
key = "ctrl+w j"
action = "window.focus_down"

[[bindings]]
context = "EditorVimNormal"
key = "ctrl+w v"
action = "window.split_right"

[[bindings]]
context = "EditorVimNormal"
key = "ctrl+w s"
action = "window.split_down"
